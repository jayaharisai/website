<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LearNew</title>
  <meta name="description" content="LearNew: learnings and concepts.">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <noscript><style>#loader{display:none}ui-navbar{opacity:1!important}</style></noscript>
</head>
<body>
  <!-- Plain black cover so nothing flashes before the first paint of the animation -->
  <div id="loader" aria-hidden="true"></div>

  <a class="skip-link" href="#main">Skip to content</a>

  <ui-bars></ui-bars>

  <ui-navbar brand="LearNew" href="/"></ui-navbar>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">
        <span class="line">
          <span class="w sans reveal" style="--d:80ms">Everything</span>
          <span class="w sans reveal" style="--d:150ms">I'm</span>
        </span>
        <span class="line">
          <span class="w serif accent reveal" style="--d:260ms">learning,
            <svg class="squiggle" viewBox="0 0 300 18" preserveAspectRatio="none" aria-hidden="true"><path d="M3 11c22-12 40 10 62 0s40-10 62 0 40 10 62 0 40-10 62 0 40 8 56 0"/></svg>
          </span>
        </span>
        <span class="line">
          <span class="w serif dim reveal" style="--d:380ms">in</span>
          <span class="w sans reveal" style="--d:440ms">one</span>
          <span class="w sans reveal" style="--d:500ms">place.</span>
        </span>
      </h1>
      <p class="lede reveal" style="--d:640ms">
        I go down the <em>rabbit holes</em>, then leave a <em class="lit">lantern</em> at every turn.
        Notes, maps and hard-won lessons, shelved in one place.
      </p>
      <div class="reveal" style="--d:780ms"><ui-ticker label="Now exploring"></ui-ticker></div>
      <p class="note reveal" style="--d:960ms">come learn with me ✦</p>
    </section>
  </main>
  <script defer src="data/menu.js"></script>
  <script defer src="ui/navbar/ui-navbar.js"></script>
  <script defer src="ui/bars/ui-bars.js"></script>
  <script defer src="ui/ticker/ui-ticker.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
